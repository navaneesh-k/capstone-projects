name: Terraform Plan CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan and Upload
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project12-terraform-plan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Initialize
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Generate Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Create Readable Plan
        run: terraform show -no-color tfplan > plan.txt

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project12-terraform-plan-nk
          path: |
            project12-terraform-plan/tfplan
            project12-terraform-plan/plan.txt
          if-no-files-found: error
          retention-days: 7
